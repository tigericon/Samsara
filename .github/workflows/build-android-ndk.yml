name: Build Samsara for Android NDK

# Samsara LLVM Obfuscator - Android NDK Build
# This workflow builds Samsara for use with Android NDK
# Supports: Linux, macOS, Windows host platforms
# Targets: AArch64 (arm64-v8a), ARM (armeabi-v7a), X86, X86_64

permissions:
  contents: write

on:
  # Trigger on release
  release:
    types: [published, edited]

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo

      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

      upload_release:
        description: 'Upload to release'
        required: false
        default: false
        type: boolean

env:
  LLVM_VERSION: "21"
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

jobs:
  # ============================================================
  # Linux Build (for Linux NDK host)
  # ============================================================
  build-linux:
    name: Build Linux x86_64
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' || github.event_name == 'release' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free Disk Space
        run: |
          echo "Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout Samsara
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 python3-pip \
            build-essential gcc g++ \
            libncurses5-dev zlib1g-dev \
            p7zip-full

      - name: Get CPU Cores
        run: echo "CORES=$(nproc)" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_Z3_SOLVER=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            llvm

      - name: Build
        run: |
          echo "Building with ${{ env.CORES }} cores..."
          cmake --build build --config ${{ env.BUILD_TYPE }} -j ${{ env.CORES }}

      - name: Install
        run: cmake --build build --target install

      - name: Verify Build
        run: |
          echo "=== Checking clang version ==="
          ./install/bin/clang --version
          echo ""
          echo "=== Checking obfuscation options ==="
          ./install/bin/clang -mllvm -help 2>&1 | grep -E "irobf|samsara" || echo "Obfuscation options available"

      - name: Package for NDK
        run: |
          mkdir -p package/bin package/lib

          # Copy compilers and tools
          cp install/bin/clang package/bin/
          cp install/bin/clang++ package/bin/
          cp install/bin/clang-${{ env.LLVM_VERSION }} package/bin/ || true
          cp install/bin/clang-cl package/bin/ || true
          cp install/bin/clang-cpp package/bin/ || true

          # Copy linkers
          cp install/bin/lld package/bin/
          cp install/bin/ld.lld package/bin/
          cp install/bin/ld64.lld package/bin/ || true
          cp install/bin/lld-link package/bin/ || true

          # Copy LLVM tools
          cp install/bin/llvm-ar package/bin/
          cp install/bin/llvm-nm package/bin/
          cp install/bin/llvm-objcopy package/bin/
          cp install/bin/llvm-objdump package/bin/
          cp install/bin/llvm-ranlib package/bin/ || true
          cp install/bin/llvm-readelf package/bin/ || true
          cp install/bin/llvm-readobj package/bin/ || true
          cp install/bin/llvm-size package/bin/ || true
          cp install/bin/llvm-strings package/bin/ || true
          cp install/bin/llvm-strip package/bin/
          cp install/bin/llvm-symbolizer package/bin/ || true

          # Copy clang runtime libraries (important!)
          cp -r install/lib/clang package/lib/

          # Create version info
          echo "Samsara LLVM ${{ env.LLVM_VERSION }} Obfuscator" > package/VERSION
          echo "Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> package/VERSION
          echo "Git Ref: ${{ github.ref }}" >> package/VERSION
          echo "Git SHA: ${{ github.sha }}" >> package/VERSION

          # Create archive
          cd package
          tar -czvf ../Samsara-${{ env.LLVM_VERSION }}-Android-NDK-linux-x86_64.tar.gz .
          cd ..

          # Calculate checksum
          sha256sum Samsara-${{ env.LLVM_VERSION }}-Android-NDK-linux-x86_64.tar.gz > Samsara-${{ env.LLVM_VERSION }}-Android-NDK-linux-x86_64.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samsara-linux-x86_64
          path: |
            Samsara-${{ env.LLVM_VERSION }}-Android-NDK-linux-x86_64.tar.gz
            Samsara-${{ env.LLVM_VERSION }}-Android-NDK-linux-x86_64.tar.gz.sha256
          retention-days: 30

  # ============================================================
  # macOS Build (for macOS NDK host)
  # ============================================================
  build-macos-x64:
    name: Build macOS x86_64
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos' || github.event_name == 'release' }}
    runs-on: macos-13
    timeout-minutes: 300

    steps:
      - name: Checkout Samsara
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Dependencies
        run: |
          brew install cmake ninja

      - name: Get CPU Cores
        run: echo "CORES=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_Z3_SOLVER=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            llvm

      - name: Build
        run: |
          echo "Building with ${{ env.CORES }} cores..."
          cmake --build build --config ${{ env.BUILD_TYPE }} -j ${{ env.CORES }}

      - name: Install
        run: cmake --build build --target install

      - name: Verify Build
        run: |
          ./install/bin/clang --version

      - name: Package for NDK
        run: |
          mkdir -p package/bin package/lib

          # Copy compilers
          cp install/bin/clang package/bin/
          cp install/bin/clang++ package/bin/
          cp install/bin/clang-${{ env.LLVM_VERSION }} package/bin/ || true

          # Copy linkers
          cp install/bin/lld package/bin/
          cp install/bin/ld.lld package/bin/
          cp install/bin/ld64.lld package/bin/ || true

          # Copy tools
          for tool in llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-ranlib llvm-size; do
            cp install/bin/$tool package/bin/ 2>/dev/null || true
          done

          # Copy clang libraries
          cp -r install/lib/clang package/lib/

          # Version info
          echo "Samsara LLVM ${{ env.LLVM_VERSION }} Obfuscator" > package/VERSION
          echo "Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> package/VERSION

          cd package
          tar -czvf ../Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-x86_64.tar.gz .
          cd ..
          shasum -a 256 Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-x86_64.tar.gz > Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-x86_64.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samsara-macos-x86_64
          path: |
            Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-x86_64.tar.gz
            Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-x86_64.tar.gz.sha256
          retention-days: 30

  # ============================================================
  # macOS ARM64 Build (for Apple Silicon)
  # ============================================================
  build-macos-arm64:
    name: Build macOS ARM64
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos' || github.event_name == 'release' }}
    runs-on: macos-14
    timeout-minutes: 300

    steps:
      - name: Checkout Samsara
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Dependencies
        run: brew install cmake ninja

      - name: Get CPU Cores
        run: echo "CORES=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_Z3_SOLVER=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            llvm

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j ${{ env.CORES }}

      - name: Install
        run: cmake --build build --target install

      - name: Package for NDK
        run: |
          mkdir -p package/bin package/lib

          cp install/bin/clang package/bin/
          cp install/bin/clang++ package/bin/
          cp install/bin/lld package/bin/
          cp install/bin/ld.lld package/bin/

          for tool in llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            cp install/bin/$tool package/bin/ 2>/dev/null || true
          done

          cp -r install/lib/clang package/lib/

          echo "Samsara LLVM ${{ env.LLVM_VERSION }} Obfuscator (ARM64)" > package/VERSION

          cd package
          tar -czvf ../Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-arm64.tar.gz .
          cd ..
          shasum -a 256 Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-arm64.tar.gz > Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-arm64.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samsara-macos-arm64
          path: |
            Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-arm64.tar.gz
            Samsara-${{ env.LLVM_VERSION }}-Android-NDK-darwin-arm64.tar.gz.sha256
          retention-days: 30

  # ============================================================
  # Windows Build (for Windows NDK host)
  # ============================================================
  build-windows:
    name: Build Windows x86_64
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' || github.event_name == 'release' }}
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Checkout Samsara
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Environment
        run: |
          echo "CORES=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV

      - name: Install Ninja and Sccache
        run: |
          choco install ninja sccache -y

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure and Build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_INSTALL_PREFIX=install ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DLLVM_ENABLE_PROJECTS="clang;lld" ^
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DLLVM_INCLUDE_DOCS=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_ENABLE_BINDINGS=OFF ^
            -DLLVM_ENABLE_LIBXML2=OFF ^
            -DLLVM_ENABLE_ZLIB=OFF ^
            -DLLVM_ENABLE_ZSTD=OFF ^
            -DLLVM_PARALLEL_LINK_JOBS=2 ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_FLAGS="/utf-8" ^
            llvm

          cmake --build build --config %BUILD_TYPE% --target install -j %CORES%

      - name: Verify Build
        shell: pwsh
        run: |
          .\install\bin\clang.exe --version

      - name: Package for NDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package\bin, package\lib -Force

          # Copy executables
          $tools = @(
            "clang.exe", "clang++.exe", "clang-cl.exe", "clang-cpp.exe",
            "lld.exe", "lld-link.exe", "ld.lld.exe",
            "llvm-ar.exe", "llvm-nm.exe", "llvm-objcopy.exe",
            "llvm-objdump.exe", "llvm-strip.exe", "llvm-readobj.exe",
            "llvm-size.exe", "llvm-lib.exe", "llvm-ranlib.exe"
          )

          foreach ($tool in $tools) {
            $src = "install\bin\$tool"
            if (Test-Path $src) {
              Copy-Item $src -Destination "package\bin\" -Force
            }
          }

          # Copy clang libraries
          Copy-Item -Path "install\lib\clang" -Destination "package\lib\" -Recurse -Force

          # Create version file
          "Samsara LLVM ${{ env.LLVM_VERSION }} Obfuscator (Windows)" | Out-File -FilePath "package\VERSION" -Encoding utf8

          # Create archive
          7z a -t7z -mx=5 "Samsara-${{ env.LLVM_VERSION }}-Android-NDK-windows-x86_64.7z" ".\package\*"

          # Calculate hash
          $hash = (Get-FileHash -Path "Samsara-${{ env.LLVM_VERSION }}-Android-NDK-windows-x86_64.7z" -Algorithm SHA256).Hash
          "$hash  Samsara-${{ env.LLVM_VERSION }}-Android-NDK-windows-x86_64.7z" | Out-File -FilePath "Samsara-${{ env.LLVM_VERSION }}-Android-NDK-windows-x86_64.7z.sha256" -Encoding utf8

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samsara-windows-x86_64
          path: |
            Samsara-${{ env.LLVM_VERSION }}-Android-NDK-windows-x86_64.7z
            Samsara-${{ env.LLVM_VERSION }}-Android-NDK-windows-x86_64.7z.sha256
          retention-days: 30

  # ============================================================
  # Release Job - Upload all artifacts to GitHub Release
  # ============================================================
  release:
    name: Upload to Release
    needs: [build-linux, build-macos-x64, build-macos-arm64, build-windows]
    if: |
      always() &&
      (github.event_name == 'release' || inputs.upload_release == true) &&
      (needs.build-linux.result == 'success' || needs.build-macos-x64.result == 'success' || needs.build-macos-arm64.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Display Artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find artifacts -type f -name "*" | head -50
          echo ""
          echo "=== File Sizes ==="
          du -sh artifacts/*/* 2>/dev/null || true

      - name: Prepare Release Files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.7z" -o -name "*.sha256" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: release-files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload via Manual Trigger
        if: github.event_name == 'workflow_dispatch' && inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.LLVM_VERSION }}-ndk-${{ github.run_number }}
          name: Samsara ${{ env.LLVM_VERSION }} Android NDK Build ${{ github.run_number }}
          draft: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
